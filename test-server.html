<!DOCTYPE html>
<html>
<head>
    <title>Server Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Server Connection Test</h1>
    
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testProducts()">Test Products Endpoint</button>
    <button onclick="testAddProduct()">Test Add Product (Needs Login)</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        async function testHealth() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test">Testing health endpoint...</div>';
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="test success">
                        <h3>✓ Health Check Success!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test error">
                        <h3>✗ Health Check Failed</h3>
                        <p>Error: ${error.message}</p>
                        <p>Make sure the server is running on port 5000</p>
                    </div>
                `;
            }
        }
        
        async function testProducts() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test">Testing products endpoint...</div>';
            
            try {
                const response = await fetch(`${API_URL}/products`);
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="test success">
                        <h3>✓ Products Endpoint Success!</h3>
                        <p>Found ${data.length} products</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test error">
                        <h3>✗ Products Endpoint Failed</h3>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testAddProduct() {
            const resultsDiv = document.getElementById('results');
            const token = localStorage.getItem('nutriToken');
            
            if (!token) {
                resultsDiv.innerHTML = `
                    <div class="test error">
                        <h3>✗ No Login Token Found</h3>
                        <p>Please login first at <a href="login.html">login.html</a></p>
                    </div>
                `;
                return;
            }
            
            resultsDiv.innerHTML = '<div class="test">Testing add product...</div>';
            
            const testProduct = {
                name: 'Test Product ' + Date.now(),
                description: 'This is a test product',
                price: 99,
                originalPrice: 149,
                category: 'Health Foods',
                image: 'images/nutrikitchen.jpg',
                weight: '100g',
                features: ['Test Feature 1', 'Test Feature 2'],
                inStock: true
            };
            
            try {
                const response = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testProduct)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `
                        <div class="test success">
                            <h3>✓ Product Added Successfully!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test error">
                            <h3>✗ Failed to Add Product</h3>
                            <p>Status: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test error">
                        <h3>✗ Request Failed</h3>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
