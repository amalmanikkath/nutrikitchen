<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile | Nutri Kitchen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dialog.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #2b6555;
      --secondary-green: #4CAF50;
      --light-green: #e8f5e9;
    }

    .profile-container {
      max-width: 1000px;
      margin: var(--space-3xl) auto;
      padding: 0 var(--space-xl);
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: var(--space-2xl);
    }

    @media (max-width: 768px) {
      .profile-container {
        grid-template-columns: 1fr;
      }
    }

    .profile-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--space-xl);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-xl);
      border-bottom: 1px solid var(--light-gray);
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      background: var(--primary-green);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto var(--space-md);
      font-family: var(--font-heading);
    }

    #user-name {
      margin: 0;
      color: var(--primary-green);
    }

    #user-email {
      color: var(--dark-gray);
      font-size: var(--text-sm);
    }

    .profile-section-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      margin-top: var(--space-xl);
      margin-bottom: var(--space-xl);
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-group {
      margin-bottom: var(--space-md);
    }

    .info-label {
      display: block;
      font-size: var(--text-xs);
      color: var(--medium-gray);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-value {
      font-weight: 500;
      color: var(--midnight);
    }

    .edit-btn {
      width: 100%;
      margin-top: var(--space-lg);
    }

    /* Form Styles */
    .profile-form {
      display: none;
    }

    .order-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      border: 1px solid var(--light-gray);
      transition: transform 0.2s;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--light-gray);
      padding-bottom: var(--space-sm);
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-xs);
      font-size: var(--text-sm);
    }

    .status-badge {
      padding: 4px 20px;
      border-radius: 20px;
      font-size: var(--text-xs);
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-paid { background: #e8f5e9; color: #2e7d32; }
    .status-pending { background: #fff3e0; color: #ef6c00; }

    .nav-logo img {
      height: 45px;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--light-gray);
      border-radius: var(--radius-md);
      margin-top: 5px;
      font-family: inherit;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: var(--space-xl);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="images/nutrikitchen.jpg" alt="Nutri Kitchen Logo">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
        <li>
          <a href="cart.html" class="cart-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="profile-container">
    <aside class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-initials">?</div>
        <h2 id="display-name">User Name</h2>
        <p id="display-email">user@example.com</p>
        </div>
        
        <div id="profile-view">
          <div class="info-group">
            <span class="info-label">Phone</span>
            <span class="info-value" id="view-phone">--</span>
          </div>
          <div class="info-group">
            <span class="info-label">Shipping Address</span>
            <span class="info-value" id="view-address">--</span>
          </div>
          <div class="info-group">
            <span class="info-label">City</span>
            <span class="info-value" id="view-city">--</span>
          </div>
          <div class="info-group">
            <span class="info-label">State</span>
            <span class="info-value" id="view-state">--</span>
          </div>
          <div class="info-group">
            <span class="info-label">Pincode</span>
            <span class="info-value" id="view-pincode">--</span>
          </div>
          <button class="btn btn-outline edit-btn" onclick="toggleEdit(true)">Edit Profile</button>
        </div>
        
        <form id="profile-form" class="profile-form">
          <div class="form-group">
            <label class="info-label">Full Name</label>
            <input type="text" id="edit-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="info-label">Phone</label>
            <input type="tel" id="edit-phone" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="info-label">Address</label>
            <input type="text" id="edit-address" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="info-label">City</label>
            <input type="text" id="edit-city" class="form-input" readonly
              style="background-color: #f5f5f5; cursor: not-allowed;" required>
          </div>
          <div class="form-group">
            <label class="info-label">State</label>
            <input type="text" id="edit-state" class="form-input" readonly
              style="background-color: #f5f5f5; cursor: not-allowed;" required>
          </div>
          <div class="form-group">
            <label class="info-label">Pincode</label>
            <input type="text" id="edit-pincode" class="form-input" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="flex: 2;">Save</button>
            <button type="button" class="btn btn-outline" style="flex: 1;" onclick="toggleEdit(false)">Cancel</button>
          </div>
      </form>
      </aside>

    <main>
      <div class="profile-section-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        Your Order History
      </div>
      <div id="orders-list">
        <p>Loading your orders...</p>
      </div>
    </main>
  </div>

  <script src="js/dialog.js"></script>
  <script src="js/auth.js"></script>
  <script>
          const PROFILE_API_URL = (window.location.protocol === 'https:')
            ? 'https://nutrikitchen.vercel.app/api'
            : (window.API_URL || '/api');

          function toggleEdit(editing) {
            const view = document.getElementById('profile-view');
            const form = document.getElementById('profile-form');
            if (view) view.style.display = editing ? 'none' : 'block';
            if (form) form.style.display = editing ? 'block' : 'none';
            if (editing) populateForm();
          }

          function populateForm() {
            const user = JSON.parse(localStorage.getItem('nutriUser') || '{}');
            const nameInput = document.getElementById('edit-name');
            const phoneInput = document.getElementById('edit-phone');
            const addressInput = document.getElementById('edit-address');
            const cityInput = document.getElementById('edit-city');
            const stateInput = document.getElementById('edit-state');
            const pincodeInput = document.getElementById('edit-pincode');

            if (nameInput) nameInput.value = user.name || '';
            if (phoneInput) phoneInput.value = user.phone || '';
            if (addressInput) addressInput.value = user.address || '';
            if (cityInput) cityInput.value = user.city || '';
            if (stateInput) stateInput.value = user.state || '';
            if (pincodeInput) pincodeInput.value = user.pincode || '';
          }

          async function updateUI() {
            if (!window.auth || !window.auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }

                  // Sync with server
                  try {
                    const response = await fetch(`${PROFILE_API_URL}/auth/profile`, {
                      headers: { 'Authorization': `Bearer ${localStorage.getItem('nutriToken')}` }
                    });
                    if (response.status === 401) {
                      window.auth.logout();
                      return;
                    }
                    if (response.ok) {
                      const freshUser = await response.json();
                      localStorage.setItem('nutriUser', JSON.stringify(freshUser));
                    }
                  } catch (err) {
                    console.error('Profile sync error:', err);
                  }

                  const user = JSON.parse(localStorage.getItem('nutriUser') || '{}');
                  if (!user.name) return;

                  const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                  const initialsEl = document.getElementById('profile-initials');
                  const nameEl = document.getElementById('display-name');
                  const emailEl = document.getElementById('display-email');

                  if (initialsEl) initialsEl.textContent = initials;
                  if (nameEl) nameEl.textContent = user.name;
                  if (emailEl) emailEl.textContent = user.email;

                  const vPhone = document.getElementById('view-phone');
                  const vAddress = document.getElementById('view-address');
                  const vCity = document.getElementById('view-city');
                  const vState = document.getElementById('view-state');
                  const vPincode = document.getElementById('view-pincode');

                  if (vPhone) vPhone.textContent = user.phone || 'Not provided';
                  if (vAddress) vAddress.textContent = user.address || 'Not provided';
                  if (vCity) vCity.textContent = user.city || 'Not provided';
                  if (vState) vState.textContent = user.state || 'Not provided';
                  if (vPincode) vPincode.textContent = user.pincode || 'Not provided';

                  loadOrders();
                }

                async function loadOrders() {
                  const list = document.getElementById('orders-list');
                  if (!list) return;
              
      try {
        const response = await fetch(`${PROFILE_API_URL}/orders/past-orders`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('nutriToken')}` }
        });
        const orders = await response.json();
        if (!orders || orders.length === 0) {
          list.innerHTML = '<p style="text-align: center; color: #888;">No orders found yet.</p>';
          return;
        }
        list.innerHTML = orders.map(o => `
          <div class="order-card">
            <div class="order-header">
              <div><strong>ORDER #${o.razorpayOrderId || o.id}</strong><div style="font-size: 11px; color: #888;">${new Date(o.createdAt).toLocaleString()}</div></div>
              <span class="status-badge status-${o.status ? o.status.toLowerCase() : 'pending'}">${o.status || 'Pending'}</span>
            </div>
            ${o.orderItems ? o.orderItems.map(i => `<div class="order-item"><span>${i.productName} × ${i.quantity}</span><span>₹${i.price * i.quantity}</span></div>`).join('') : ''}
            <div style="text-align: right; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px;"><strong>Total: ₹${o.totalAmount}</strong></div>
          </div>
        `).join('');
          } catch (e) {
            list.innerHTML = '<p>Error loading orders.</p>';
          }
        }

        // Auto-fill address from pincode
        const pincodeInput = document.getElementById('edit-pincode');
        if (pincodeInput) {
          pincodeInput.addEventListener('input', async (e) => {
            const pincode = e.target.value;
            if (pincode.length === 6 && /^\d+$/.test(pincode)) {
              try {
                // Show loading state or feedback if desired
                const response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                const data = await response.json();

                if (data && data[0].Status === 'Success') {
                  const details = data[0].PostOffice[0];

                  const cityInput = document.getElementById('edit-city');
                  const stateInput = document.getElementById('edit-state');

                  if (cityInput) cityInput.value = details.District;
                  if (stateInput) stateInput.value = details.State;

                  // Optional: Show success feedback via dialog if you want, or just let it populate
                } else {
        // Optional: Show invalid pincode warning
        // user might still be typing, so maybe don't alert immediately
            }
          } catch (error) {
            console.error('Error fetching pincode details:', error);
          }
        }
      });
    }

  const profileForm = document.getElementById('profile-form');
  if (profileForm) {
    profileForm.onsubmit = async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('edit-name').value,
        phone: document.getElementById('edit-phone').value,
        address: document.getElementById('edit-address').value,
        city: document.getElementById('edit-city').value,
        state: document.getElementById('edit-state').value,
        pincode: document.getElementById('edit-pincode').value
      };
      try {
        const res = await fetch(`${PROFILE_API_URL}/auth/profile/update`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('nutriToken')}`
          },
          body: JSON.stringify(data)
        });
                                  if (res.ok) {
                                    const result = await res.json();
                                    localStorage.setItem('nutriUser', JSON.stringify(result.user));
                                    toggleEdit(false);
                                    updateUI();
                                    showAlert('Profile updated!', 'success');
                                  } else {
                                    const errData = await res.json();
                                    showAlert(errData.message || 'Update failed', 'error');
                                  }
                                } catch (e) {
                                  showAlert('Connection error', 'error');
                                }
                              };
                            }

                            document.addEventListener('DOMContentLoaded', updateUI);
  </script>
</body>
</html>
