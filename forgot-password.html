<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Nutri Kitchen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/validation.css">
  <link rel="stylesheet" href="css/dialog.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
    }
    .auth-box {
      background: white;
      padding: var(--space-3xl);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      max-width: 450px;
      width: 100%;
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }
    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: var(--text-2xl);
      color: var(--primary-dark);
      margin-bottom: var(--space-xs);
    }
    .form-group {
      margin-bottom: var(--space-lg);
    }
    .form-label {
      display: block;
      margin-bottom: var(--space-sm);
      font-weight: 600;
      font-size: var(--text-sm);
    }
    .form-input {
      width: 100%;
      padding: var(--space-md);
      border: 2px solid var(--light-gray);
      border-radius: var(--radius-md);
      transition: all 0.3s ease;
    }
    .form-input:focus {
      border-color: var(--primary-green);
      outline: none;
      box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
    }
    .auth-footer {
      text-align: center;
      margin-top: var(--space-xl);
      font-size: var(--text-sm);
    }
    .auth-footer a {
      color: var(--primary-green);
      font-weight: 600;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    @media (max-width: 768px) {
      .form-input {
        padding: 10px 12px !important;
      }
      .auth-box {
        padding: var(--space-xl);
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="images/nutrikitchen.jpg" alt="Logo">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-box animate-scale-in">
      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p>Enter your email to receive a verification code</p>
      </div>
      
      <!-- Message Container -->
      <div id="auth-message" style="display: none; padding: 10px; margin-bottom: 20px; border-radius: 4px; text-align: center; font-size: 14px;"></div>

      <form id="forgot-password-form">
        <!-- Step 1: Enter Email -->
        <div id="step-1" class="form-step active">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
          </div>
          <button type="button" id="send-reset-otp-btn" class="btn btn-primary" style="width: 100%;">Send Verification Code</button>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step-2" class="form-step">
          <div class="form-group">
            <label class="form-label">Enter Verification Code</label>
            <input type="text" id="otp" class="form-input" placeholder="6-digit code" maxlength="6" pattern="[0-9]{6}" required>
            <p style="font-size: var(--text-sm); color: var(--secondary-gray); margin-top: var(--space-sm);">
              We've sent a verification code to <strong id="verification-display"></strong>
            </p>
          </div>
          <button type="button" id="verify-otp-btn" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-sm);">Verify Code</button>
          <button type="button" id="resend-otp-btn" class="btn" style="width: 100%; background: transparent; color: var(--primary-green); border: 2px solid var(--primary-green); margin-bottom: var(--space-sm);">Resend Code</button>
          <button type="button" id="back-to-email-btn" class="btn" style="width: 100%; background: transparent; color: var(--secondary-gray); border: 2px solid var(--light-gray);">← Back</button>
        </div>

        <!-- Step 3: Set New Password -->
        <div id="step-3" class="form-step">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new-password" class="form-input" placeholder="••••••••" required>
            <p style="font-size: var(--text-sm); color: var(--secondary-gray); margin-top: var(--space-xs);">
              Must be at least 6 characters
            </p>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
        </div>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script src="js/dialog.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    var API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:5000/api'
      : '/api';

    let userEmail = '';
    let resetToken = '';

    // Show message helper
    function showMessage(message, type = 'error') {
      const msgDiv = document.getElementById('auth-message');
      if (msgDiv) {
        msgDiv.style.display = 'block';
        msgDiv.textContent = message;
        msgDiv.style.backgroundColor = type === 'success' ? '#d4edda' : '#f8d7da';
        msgDiv.style.color = type === 'success' ? '#155724' : '#721c24';
        msgDiv.style.borderColor = type === 'success' ? '#c3e6cb' : '#f5c6cb';
        msgDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Step navigation
    function showStep(stepNumber) {
      document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step-${stepNumber}`).classList.add('active');
    }

    // Step 1: Send Reset OTP
    document.getElementById('send-reset-otp-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('Please enter a valid email address', 'error');
        return;
      }

      const btn = document.getElementById('send-reset-otp-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        
        if (response.ok) {
          userEmail = email;
          showStep(2);
          document.getElementById('verification-display').textContent = email;
          showMessage(data.message || 'Verification code sent to your email', 'success');
        } else {
          showMessage(data.message || 'Failed to send verification code', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Error connecting to server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Verification Code';
      }
    });

    // Step 2: Verify OTP
    document.getElementById('verify-otp-btn').addEventListener('click', async () => {
      const otp = document.getElementById('otp').value.trim();
      
      if (!otp || otp.length !== 6) {
        showMessage('Please enter a valid 6-digit code', 'error');
        return;
      }

      const btn = document.getElementById('verify-otp-btn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const response = await fetch(`${API_URL}/auth/verify-reset-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp })
        });

        const data = await response.json();
        
        if (response.ok) {
          resetToken = data.resetToken;
          showStep(3);
          showMessage('Code verified! Please set your new password', 'success');
        } else {
          showMessage(data.message || 'Invalid verification code', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Error connecting to server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify Code';
      }
    });

    // Resend OTP
    document.getElementById('resend-otp-btn').addEventListener('click', async () => {
      const btn = document.getElementById('resend-otp-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });

        const data = await response.json();
        
        if (response.ok) {
          showMessage(data.message || 'Verification code resent', 'success');
        } else {
          showMessage(data.message || 'Failed to resend code', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Error connecting to server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Resend Code';
      }
    });

    // Back button
    document.getElementById('back-to-email-btn').addEventListener('click', () => {
      showStep(1);
      document.getElementById('otp').value = '';
    });

    // Step 3: Reset Password
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: userEmail, 
            resetToken, 
            newPassword 
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          showMessage('Password reset successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.message || 'Failed to reset password', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Error connecting to server', 'error');
      }
    });
  </script>
</body>
</html>
